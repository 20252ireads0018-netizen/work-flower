<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Identidade "Onda japonesa" (ukiyo-e, inspirada em gravuras de domínio público): papel creme, azul-da-prússia, sol vermelho -->
  <defs>
    <filter id="papel" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="4" result="r"/>
      <feColorMatrix type="matrix" values="0 0 0 0 .45  0 0 0 0 .38  0 0 0 0 .25  0 0 0 .10 0" in="r" result="g"/>
    </filter>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9dcc0"/><stop offset=".55" stop-color="#f3ead6"/><stop offset="1" stop-color="#e6d6b4"/>
    </linearGradient>
    <linearGradient id="agua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c5383"/><stop offset=".6" stop-color="#1b3358"/><stop offset="1" stop-color="#14274a"/>
    </linearGradient>
    <linearGradient id="agua2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7fae"/><stop offset="1" stop-color="#20406b"/>
    </linearGradient>
    <g id="garra" fill="#f7f1e3" stroke="#1b3358" stroke-width="3">
      <path d="M0,0 c10,-14 30,-14 36,0 c-10,-6 -18,-2 -20,6 c-4,-6 -10,-8 -16,-6z"/>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#ceu)"/>
  <!-- nuvens em faixas -->
  <g fill="#e2d0ab" opacity=".7">
    <rect x="760" y="120" width="520" height="22" rx="11"/>
    <rect x="860" y="160" width="380" height="16" rx="8"/>
    <rect x="1180" y="380" width="300" height="14" rx="7"/>
  </g>
  <!-- sol -->
  <circle cx="1270" cy="250" r="78" fill="#c8432f" opacity=".92"/>
  <!-- monte -->
  <path d="M960,770 L1110,575 C1118,566 1130,566 1138,575 L1300,770 Z" fill="#2b4568"/>
  <path d="M1068,630 L1110,575 C1118,566 1130,566 1138,575 L1182,632 C1168,622 1158,640 1146,628 C1136,644 1124,622 1112,640 C1100,624 1086,642 1068,630 Z" fill="#f7f1e3"/>

  <!-- mar ao fundo -->
  <path d="M0,760 C200,730 420,790 640,760 C860,730 1080,790 1300,765 C1440,750 1540,770 1600,760 L1600,1000 L0,1000 Z" fill="url(#agua2)"/>
  <g stroke="#a9c3db" stroke-width="3" fill="none" opacity=".6">
    <path d="M60,820 C180,800 300,840 420,815"/><path d="M900,830 C1020,810 1140,850 1260,822"/>
    <path d="M500,880 C620,860 740,900 860,872"/><path d="M1200,900 C1320,880 1440,915 1560,890"/>
  </g>

  <!-- barcos -->
  <g fill="#d8bf87" stroke="#5a4526" stroke-width="3">
    <path d="M430,790 C560,830 760,826 880,770 L874,792 C760,850 560,856 430,812 Z"/>
    <path d="M1180,860 C1270,884 1400,880 1480,846 L1476,862 C1400,900 1270,904 1180,878 Z"/>
  </g>

  <!-- onda grande -->
  <path d="M0,1000 L0,560 C30,420 150,270 330,215 C480,170 640,200 720,300 C760,350 756,410 716,438 C680,462 628,446 618,404 C610,366 644,342 672,360
           C640,420 600,470 588,560 C574,680 640,860 790,1000 Z" fill="url(#agua)"/>
  <!-- faixas claras dentro da onda -->
  <g fill="none" stroke="#6f9cc7" stroke-width="7" stroke-linecap="round" opacity=".75">
    <path d="M40,640 C70,480 170,340 320,282"/>
    <path d="M90,760 C110,600 200,450 360,350"/>
    <path d="M170,900 C180,740 260,580 420,470"/>
    <path d="M300,1000 C300,860 360,700 500,590"/>
  </g>
  <g fill="none" stroke="#f7f1e3" stroke-width="4" stroke-linecap="round" opacity=".8">
    <path d="M20,580 C50,450 150,320 300,262"/>
    <path d="M130,700 C150,560 240,430 390,338"/>
  </g>
  <!-- espuma da crista (garras) -->
  <g fill="#f7f1e3" stroke="#1b3358" stroke-width="3">
    <path d="M300,222 C360,180 470,168 560,190 C640,210 700,250 730,310 C744,340 742,380 724,410 C716,380 700,356 676,346 C690,330 686,300 664,292 C676,276 662,254 640,256 C644,236 622,222 604,232 C598,212 572,206 560,222 C548,202 520,202 512,222 C496,206 470,210 466,230 C446,216 420,224 420,246 C398,236 374,248 376,270 C356,262 334,276 340,298 C318,292 298,306 304,328 C286,320 262,316 252,300 C264,260 280,238 300,222 Z"/>
  </g>
  <g transform="translate(676,346) rotate(20)"><use href="#garra"/></g>
  <g transform="translate(640,256) rotate(-10)"><use href="#garra"/></g>
  <g transform="translate(560,222) rotate(-20)"><use href="#garra"/></g>
  <g transform="translate(466,230) rotate(-30)"><use href="#garra"/></g>
  <g transform="translate(376,270) rotate(-40)"><use href="#garra"/></g>
  <g transform="translate(304,328) rotate(-55)"><use href="#garra"/></g>
  <!-- respingos -->
  <g fill="#f7f1e3">
    <circle cx="760" cy="300" r="7"/><circle cx="790" cy="340" r="5"/><circle cx="772" cy="380" r="6"/><circle cx="812" cy="300" r="4"/>
    <circle cx="740" cy="250" r="5"/><circle cx="830" cy="360" r="4"/><circle cx="700" cy="220" r="6"/><circle cx="850" cy="320" r="3"/>
    <circle cx="880" cy="380" r="4"/><circle cx="756" cy="430" r="5"/><circle cx="800" cy="420" r="3"/>
  </g>

  <!-- onda pequena da frente -->
  <path d="M960,1000 C1010,920 1110,868 1230,872 C1320,876 1380,912 1398,960 C1370,932 1330,930 1318,958 C1300,940 1272,948 1276,976 L1600,1000 Z" fill="url(#agua)"/>
  <path d="M1230,872 C1320,876 1380,912 1398,960 C1376,946 1356,940 1340,946 C1336,926 1316,914 1296,922 C1290,904 1268,896 1252,906 C1248,890 1236,880 1230,872 Z" fill="#f7f1e3" stroke="#1b3358" stroke-width="3"/>

  <!-- cartela (sem texto) -->
  <rect x="1380" y="70" width="150" height="56" rx="4" fill="#efe2c4" stroke="#8b6a3e" stroke-width="3"/>
  <rect x="1392" y="80" width="126" height="36" rx="2" fill="none" stroke="#8b6a3e" stroke-width="1.5"/>
  <rect x="1478" y="140" width="34" height="40" rx="3" fill="#b8392b"/>

  <rect width="1600" height="1000" fill="transparent" filter="url(#papel)"/>
  <rect width="1600" height="1000" fill="#000" opacity="0" />
</svg>
