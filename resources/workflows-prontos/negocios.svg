<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Identidade "Art déco": verde-garrafa profundo, dourado, leque de raios e skyline geométrico -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b2b26"/><stop offset="1" stop-color="#061a17"/></linearGradient>
    <linearGradient id="ouro" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3d58b"/><stop offset=".5" stop-color="#c9a24a"/><stop offset="1" stop-color="#8f6d2a"/></linearGradient>
  </defs>
  <rect width="1600" height="1000" fill="url(#fundo)"/>
  <!-- leque de raios -->
  <g stroke="url(#ouro)" stroke-width="2" opacity=".55">
    <path d="M800,760 L800,60"/><path d="M800,760 L620,80"/><path d="M800,760 L980,80"/><path d="M800,760 L450,140"/><path d="M800,760 L1150,140"/>
    <path d="M800,760 L300,240"/><path d="M800,760 L1300,240"/><path d="M800,760 L170,380"/><path d="M800,760 L1430,380"/><path d="M800,760 L80,540"/><path d="M800,760 L1520,540"/>
  </g>
  <g fill="none" stroke="url(#ouro)" stroke-width="3" opacity=".8">
    <path d="M500,760 A300,300 0 0 1 1100,760"/><path d="M560,760 A240,240 0 0 1 1040,760"/><path d="M620,760 A180,180 0 0 1 980,760"/>
  </g>
  <!-- skyline -->
  <g fill="#0e3b34" stroke="url(#ouro)" stroke-width="3">
    <path d="M90,1000 V640 H190 V600 H230 V640 H300 V1000 Z"/>
    <path d="M330,1000 V520 L380,470 L430,520 V1000 Z"/>
    <path d="M460,1000 V580 H560 V1000 Z"/>
    <path d="M700,1000 V420 L740,400 V330 L760,320 V250 L770,180 L780,250 V320 L800,330 V400 L840,420 V1000 Z"/>
    <path d="M880,1000 V560 H980 V520 H1020 V1000 Z"/>
    <path d="M1060,1000 V470 L1110,430 L1160,470 V1000 Z"/>
    <path d="M1200,1000 V600 H1300 V560 H1340 V1000 Z"/>
    <path d="M1380,1000 V500 H1480 V1000 Z"/>
  </g>
  <g fill="#f3d58b" opacity=".75">
    <rect x="110" y="680" width="12" height="18"/><rect x="150" y="720" width="12" height="18"/><rect x="250" y="700" width="12" height="18"/>
    <rect x="360" y="580" width="10" height="16"/><rect x="390" y="640" width="10" height="16"/><rect x="490" y="620" width="12" height="18"/><rect x="520" y="700" width="12" height="18"/>
    <rect x="716" y="460" width="10" height="16"/><rect x="760" y="520" width="10" height="16"/><rect x="800" y="480" width="10" height="16"/><rect x="740" y="620" width="10" height="16"/>
    <rect x="910" y="600" width="12" height="18"/><rect x="950" y="680" width="12" height="18"/><rect x="1090" y="520" width="10" height="16"/><rect x="1130" y="600" width="10" height="16"/>
    <rect x="1230" y="640" width="12" height="18"/><rect x="1300" y="700" width="12" height="18"/><rect x="1410" y="560" width="12" height="18"/><rect x="1440" y="640" width="12" height="18"/>
  </g>
  <!-- moldura -->
  <rect x="30" y="30" width="1540" height="940" fill="none" stroke="url(#ouro)" stroke-width="3" opacity=".7"/>
  <rect x="46" y="46" width="1508" height="908" fill="none" stroke="url(#ouro)" stroke-width="1.5" opacity=".5"/>
  <g fill="url(#ouro)"><path d="M30,30 L90,30 L30,90 Z"/><path d="M1570,30 L1510,30 L1570,90 Z"/></g>
</svg>
