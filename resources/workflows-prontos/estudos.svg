  <rect x="620" y="680" width="80" height="92" rx="12" fill="#f4efe6"/><path d="M700,700 C740,700 740,750 700,750" fill="none" stroke="#f4efe6" stroke-width="12"/>
  <path d="M640,660 C630,630 660,620 650,590 M670,660 C660,630 690,620 680,590" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="5" stroke-linecap="round"/>
