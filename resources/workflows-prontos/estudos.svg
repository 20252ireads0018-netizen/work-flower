  <path d="M120,772 L140,690 H220 L240,772 Z" fill="#c76b4a"/>
  <g fill="#5fa777"><path d="M180,690 C120,640 110,580 130,540 C170,580 190,630 180,690Z"/><path d="M180,690 C230,630 270,610 300,600 C290,650 240,690 180,690Z"/><path d="M180,690 C170,610 190,560 220,520 C230,580 210,640 180,690Z"/></g>
  <!-- caderno -->
  <path d="M480,790 L760,760 L800,850 L500,880 Z" fill="#fbf6ea"/><path d="M520,800 L740,778 M528,820 L748,798 M536,840 L756,818" stroke="#9fb3d9" stroke-width="3"/>
