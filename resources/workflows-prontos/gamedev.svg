<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <!-- Identidade "Arcade synthwave": sol listrado, montanhas neon, grade em perspectiva -->
  <defs>
    <linearGradient id="ceu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d0628"/><stop offset=".55" stop-color="#3b0f5e"/><stop offset="1" stop-color="#7a1f6f"/></linearGradient>
    <linearGradient id="sol" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe66d"/><stop offset=".5" stop-color="#ff8a5b"/><stop offset="1" stop-color="#ff3d8b"/></linearGradient>
    <linearGradient id="chao" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0638"/><stop offset="1" stop-color="#090219"/></linearGradient>
    <clipPath id="corte"><circle cx="800" cy="520" r="250"/></clipPath>
    <filter id="brilho"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#ceu)"/>
  <g fill="#fff"><circle cx="120" cy="90" r="2"/><circle cx="300" cy="180" r="1.5"/><circle cx="520" cy="70" r="2"/><circle cx="1100" cy="120" r="2"/><circle cx="1300" cy="60" r="1.5"/><circle cx="1480" cy="200" r="2"/><circle cx="1400" cy="320" r="1.5"/><circle cx="200" cy="300" r="1.5"/></g>
  <!-- pixels flutuando -->
  <g fill="#47e5ff" opacity=".8"><rect x="210" y="150" width="14" height="14"/><rect x="224" y="164" width="14" height="14"/><rect x="1330" y="240" width="14" height="14"/><rect x="1344" y="226" width="14" height="14"/><rect x="1358" y="240" width="14" height="14"/></g>
  <g clip-path="url(#corte)">
    <rect x="550" y="270" width="500" height="500" fill="url(#sol)"/>
    <g fill="#3b0f5e"><rect x="540" y="560" width="520" height="10"/><rect x="540" y="600" width="520" height="16"/><rect x="540" y="642" width="520" height="22"/><rect x="540" y="690" width="520" height="30"/></g>
  </g>
  <!-- montanhas -->
  <path d="M0,700 L180,520 L320,640 L470,470 L640,700 Z" fill="#22093f" stroke="#ff3d8b" stroke-width="3" filter="url(#brilho)"/>
  <path d="M960,700 L1120,500 L1260,620 L1420,460 L1600,640 L1600,700 Z" fill="#22093f" stroke="#ff3d8b" stroke-width="3" filter="url(#brilho)"/>
  <!-- chão com grade -->
  <rect y="700" width="1600" height="300" fill="url(#chao)"/>
  <g stroke="#ff4fd8" stroke-width="2.5" filter="url(#brilho)" opacity=".9">
    <path d="M0,700 H1600"/><path d="M0,712 H1600"/><path d="M0,730 H1600"/><path d="M0,756 H1600"/><path d="M0,792 H1600"/><path d="M0,840 H1600"/><path d="M0,904 H1600"/><path d="M0,984 H1600"/>
    <path d="M800,700 V1000"/><path d="M760,700 L560,1000"/><path d="M720,700 L320,1000"/><path d="M680,700 L80,1000"/><path d="M640,700 L-160,1000"/><path d="M600,700 L-400,1000"/>
    <path d="M840,700 L1040,1000"/><path d="M880,700 L1280,1000"/><path d="M920,700 L1520,1000"/><path d="M960,700 L1760,1000"/><path d="M1000,700 L2000,1000"/>
  </g>
</svg>
